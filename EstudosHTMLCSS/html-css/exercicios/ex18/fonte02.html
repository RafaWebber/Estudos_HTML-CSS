<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'london';
            src: url('fontes/OldLondonAlternate.ttf') format('truetype'), url('fontes/Olondon_.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        } 
        body{
            font-family: 'london', Arial, Helvetica, sans-serif;
            font-weight: normal;
        }
        h1{
            font-family: 'london', Times, serif;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Neque iure quis sint commodi iusto. Totam minus perferendis atque magnam veniam pariatur, vero delectus illum ipsa quia aspernatur quaerat temporibus sint.</p>
</body>
</html>
