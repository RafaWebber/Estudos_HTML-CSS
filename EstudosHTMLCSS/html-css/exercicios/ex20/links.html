<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: darkcyan;
            text-decoration: none;
            font-weight: bolder;
        }

        a:visited{
            color: rgb(0, 61, 61);
        }
        a:hover{
           text-decoration: underline; 
           color: rgb(1, 175, 175);
        }
        a:active{
            color: aqua;
        }
        a::after{
            content: ' [link]';
            text-decoration: none;
            font-weight: normal;
            color: rgb(95, 176, 176);
        }
        .especial{
            background-color: rgb(135, 135, 135);
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/RafaWebber" target="_blank">Perfil no Github</a></li>
        <li><a href="https://www.linkedin.com/in/rafaelwebbertoupper?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank">Perfil no LinkedIn</a></li>
        <li><a href="https://www.instagram.com/rafa.el_w.17?utm_source=qr&igsh=MWRxMXQwZ2Qxemtieg==" target="_blank" class="especial">Perfil no Instagram</a></li>
    </ul>
</body>
</html>
