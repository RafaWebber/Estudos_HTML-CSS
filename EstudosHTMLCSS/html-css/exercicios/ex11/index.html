<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Media</title>
</head>
<body>
    <h1>Dynamic Images</h1>
    <p>Try opening this site on various devices</p>

    <picture>
        <source media="(max-width:750px)" srcset="imagens/foto_p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto_m.png" type="image/png">
        <img src="imagens/foto_g.png" alt="Foto grande">
    </picture>

    <h1>Playing Audio</h1>
    <p>Let's learn hoe to play audios</p>
    <audio src="midia/Kuntry Boy - Anno Domini Beats.mp3" controls loop></audio><br>

    <audio preload="metadata" controls>
        <source src="midia/Kuntry Boy - Anno Domini Beats.mp3" type="audio/mpeg">
        <source src="midia/Kuntry Boy - Anno Domini Beats.wav" type="audio/wav">
        <source src="midia/Kuntry Boy - Anno Domini Beats.ogg" type="audio/ogg">
        <p>Unfortunately, your browser does not support audio. <a href="midia/Kuntry Boy - Anno Domini Beats.mp3">Click here to download the audio.</a></p>

    </audio>
</body>
</html>
