<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * { /* Cong globais das CSS*/
            height: 100%;
        }
        body {
            background-image: linear-gradient(-45deg, #52729C, #645BA5, #4A9B87);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando o gradiente</h1>
</body>
</html>
